<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d"><title>TAKUEFLIX Admin — Takueflow Studio</title>
<style>
:root{--bg:#08090d;--panel:#11131a;--panel2:#171a23;--text:#f7f7fa;--muted:#9da3b3;--accent:#ff5a36;--line:#252936;--good:#32d583}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh}.side{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#0e1016;border-top:1px solid var(--line);display:flex;overflow:auto}.side button{flex:1;min-width:85px;background:none;color:var(--muted);border:0;padding:12px 6px;font-size:11px}.side button.active{color:white;background:var(--panel)}.main{padding:18px 14px 90px;max-width:1300px;margin:auto}.brand{font-size:21px;font-weight:900}.brand span{color:var(--accent)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr)}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{font-size:25px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{background:var(--accent);color:white;border:0;border-radius:11px;padding:11px 14px;font-weight:800}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}input,select,textarea{width:100%;background:var(--panel2);color:white;border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}.form{display:grid;gap:10px}.row2{display:grid;gap:10px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left}.badge{padding:4px 7px;border-radius:999px;background:#252936;font-size:11px}.good{color:var(--good)}.hide{display:none}.danger{color:#ff8e8e}.section{margin-top:18px}h1,h2,h3{margin-top:0}.notice{padding:12px;border-radius:12px;background:#211c16;color:#ffd9a8;margin-bottom:12px}
@media(min-width:800px){.side{top:0;bottom:0;right:auto;width:230px;display:block;border:0;border-right:1px solid var(--line);padding:18px}.side button{display:block;width:100%;text-align:left;font-size:14px;border-radius:10px;margin:4px 0}.main{margin-left:230px;padding:28px;max-width:none}.stats{grid-template-columns:repeat(4,1fr)}.row2{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div class="layout">
<nav class="side">
<div class="brand">TAKUE<span>FLIX</span></div><p class="muted">Takueflow Studio Admin</p>
<button class="active" onclick="show('dashboard',this)">📊 Dashboard</button>
<button onclick="show('series',this)">🎬 Series & Episodes</button>
<button onclick="show('users',this)">👥 Users</button>
<button onclick="show('engagement',this)">🔥 Engagement</button>
<button onclick="show('monetization',this)">💳 Monetization</button>
<button onclick="show('moderation',this)">💬 Moderation</button>
<button onclick="show('settings',this)">⚙ Settings</button>
</nav>
<main class="main"><div class="top"><div><div class="brand">TAKUE<span>FLIX</span> Admin</div><div class="muted">Control your streaming platform without editing source code.</div></div><button class="btn secondary" onclick="logout()">Log out</button></div>
<div id="content"></div></main></div>
<script>
const KEY='takueflix_admin';let data=JSON.parse(localStorage.getItem(KEY)||'{"series":[],"episodes":[],"users":0,"rewardAds":0,"unlocks":0,"settings":{"episodesPerAd":5,"dailyAdLimit":10,"defaultAccess":"REWARDED_AD"}}');
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function show(page,el){document.querySelectorAll('.side button').forEach(b=>b.classList.remove('active'));el.classList.add('active');if(page==='dashboard')dashboard();if(page==='series')series();if(page==='users')users();if(page==='engagement')engagement();if(page==='monetization')monetization();if(page==='moderation')moderation();if(page==='settings')settings()}
function dashboard(){content.innerHTML=`<h1>Dashboard</h1><div class="grid stats"><div class="stat"><div class="muted">Users</div><b>${data.users||0}</b></div><div class="stat"><div class="muted">Series</div><b>${data.series.length}</b></div><div class="stat"><div class="muted">Rewarded Ads</div><b>${data.rewardAds}</b></div><div class="stat"><div class="muted">Episode Unlocks</div><b>${data.unlocks}</b></div></div><div class="section panel"><h2>Content performance</h2><p class="muted">Track views, watch time, completion, likes, comments, shares, ratings, follows, watchlist additions and recent growth through the connected backend.</p><div class="notice">This HTML demo stores admin data locally. For a real deployment, connect authentication and a server/database before using payments, ad rewards or private admin operations.</div></div>`}
function series(){content.innerHTML=`<h1>Series & Episodes</h1><div class="panel"><h2>Add Series</h2><form class="form" onsubmit="addSeries(event)"><input id="stitle" required placeholder="Series title"><textarea id="sdesc" placeholder="Description"></textarea><div class="row2"><input id="genre" placeholder="Genres"><input id="year" placeholder="Release year"></div><div class="row2"><input id="poster" placeholder="Poster image URL"><input id="banner" placeholder="Banner image URL"></div><div class="row2"><select id="access"><option>REWARDED_AD</option><option>FREE</option><option>PAID</option><option>PREMIUM_ONLY</option></select><input id="eps" type="number" value="10" min="1" placeholder="Episode count"></div><button class="btn">Save Series</button></form></div><div class="section panel"><h2>Series</h2>${data.series.length?`<table class="table"><tr><th>Title</th><th>Episodes</th><th>Access</th><th>Action</th></tr>${data.series.map((s,i)=>`<tr><td>${s.title}</td><td>${s.eps}</td><td><span class="badge">${s.access}</span></td><td><button class="btn secondary" onclick="addEpisode(${i})">+ Episode</button></td></tr>`).join('')}</table>`:'<div class="muted">No series added yet.</div>'}</div>`}
function addSeries(e){e.preventDefault();data.series.push({title:stitle.value,desc:sdesc.value,genre:genre.value,year:year.value,poster:poster.value,banner:banner.value,access:access.value,eps:+eps.value});save();series()}
function addEpisode(i){let s=data.series[i];let n=prompt('Episode number?',String(s.eps+1));if(!n)return;data.episodes.push({series:s.title,number:+n,title:prompt('Episode title?')||`Episode ${n}`,access:+n<=5?'FREE':data.settings.defaultAccess});save();alert('Episode saved. Default rule: Episodes 1-5 FREE; later episodes use configured access.')}
function users(){content.innerHTML=`<h1>Users</h1><div class="panel"><p>Total registered users: <b>${data.users||0}</b></p><p class="muted">Production version should use secure authentication, roles, profiles, watch history, watchlists, follows, likes, reviews, subscriptions and entitlements in the backend.</p></div>`}
function engagement(){content.innerHTML=`<h1>Engagement & Trending</h1><div class="panel"><h2>Trending score</h2><p class="muted">Configure the production backend to combine recent views, unique viewers, watch time, completion rate, likes, comments, comment likes, shares, follows, watchlist additions, ratings, review engagement, episode unlocks and recent growth with time decay. Do not rank by raw views alone.</p><table class="table"><tr><th>Signal</th><th>Use</th></tr><tr><td>Watch time</td><td>High influence</td></tr><tr><td>Completion</td><td>High influence</td></tr><tr><td>Likes/comments/shares</td><td>Engagement</td></tr><tr><td>Ratings/reviews</td><td>Quality + engagement</td></tr><tr><td>Recent growth</td><td>Recency</td></tr></table></div>`}
function monetization(){content.innerHTML=`<h1>Monetization</h1><div class="panel"><h2>Rewarded Ads</h2><div class="row2"><label>Episodes unlocked per completed ad<input id="epad" type="number" value="${data.settings.episodesPerAd}" min="1"></label><label>Daily rewarded-ad limit<input id="alim" type="number" value="${data.settings.dailyAdLimit}" min="1"></label></div><button class="btn" onclick="saveRewards()">Save Reward Settings</button><h2 class="section">Subscriptions</h2><table class="table"><tr><th>Plan</th><th>Price</th></tr><tr><td>Weekly</td><td>$0.99 / week</td></tr><tr><td>Monthly</td><td>$3.99 / month</td></tr><tr><td>2 Months</td><td>$4.99 / 2 months</td></tr><tr><td>Yearly</td><td>$15 / year</td></tr><tr><td>Remove Ads</td><td>$0.99 / month</td></tr></table><p class="muted">Android subscriptions should be processed and verified with Google Play Billing. Never grant entitlements from client-side purchase claims.</p></div>`}
function saveRewards(){data.settings.episodesPerAd=+epad.value;data.settings.dailyAdLimit=+alim.value;save();alert('Reward settings saved.')}
function moderation(){content.innerHTML=`<h1>Moderation</h1><div class="panel"><h2>Comments & Reports</h2><p class="muted">Production backend should provide reported comments, hide/delete, review, user restrictions, spam protection, comment likes and replies.</p><div class="empty">No reports in this local demo.</div></div>`}
function settings(){content.innerHTML=`<h1>Settings</h1><div class="panel"><h2>Default episode rules</h2><p>Episodes 1-5 are FREE.</p><p>Episode 6+ default: <b>${data.settings.defaultAccess}</b></p><select onchange="data.settings.defaultAccess=this.value;save()"><option ${data.settings.defaultAccess==='REWARDED_AD'?'selected':''}>REWARDED_AD</option><option>FREE</option><option>PAID</option><option>PREMIUM_ONLY</option></select><h2 class="section">Security</h2><p class="muted">For production, replace local admin storage with server-side authentication and role-based authorization. Keep payment, ad verification and database secrets in Netlify environment variables/server functions, never in browser code.</p></div>`}
function logout(){alert('Connect this button to secure server-side admin authentication in production.')}
dashboard();
</script>
</body></html>
