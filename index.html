<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TakueFlix - Drama Streaming</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f12;color:#fff}
header{background:#15151a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:20px;color:#a78bfa;letter-spacing:1px}
.logo span{color:#fff}
.search{width:55%;background:#23232a;border:0;padding:8px 12px;border-radius:20px;color:#fff;outline:none}
.banner{background:linear-gradient(135deg,#7c3aed,#ec4899);padding:20px;border-radius:16px;margin:16px}
.banner h2{font-size:18px;margin-bottom:6px}
.banner p{opacity:.9;font-size:13px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.cats button{background:#23232a;border:1px solid #333;color:#ccc;padding:6px 14px;border-radius:20px;white-space:nowrap}
.cats button.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#1c1c21;border-radius:12px;overflow:hidden;border:1px solid #2a2a32}
.card img{width:100%;height:190px;object-fit:cover;background:#222}
.card-info{padding:8px}
.card-info h4{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-info p{font-size:11px;color:#888;margin-top:2px}
.player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99;display:none;flex-direction:column}
.player.active{display:flex}
.video-wrap{flex:1;background:#000;display:flex;align-items:center;justify-content:center}
.player video{width:100%;max-height:70vh}
.player-top{padding:12px;display:flex;justify-content:space-between;align-items:center;background:#15151a}
.ep-list{max-height:35vh;overflow-y:auto;background:#15151a;padding:10px;display:flex;flex-wrap:wrap;gap:8px}
.ep-list button{background:#23232a;border:0;color:#fff;padding:8px 12px;border-radius:8px}
.ep-list button.playing{background:#7c3aed}
</style>
</head>
<body>
<header>
<div class="logo">TAKUE<span>FLIX</span></div>
<input class="search" id="search" placeholder="Search drama..." oninput="doSearch()">
</header>

<div class="banner">
<h2>🔥 Trending Short Dramas</h2>
<p>Upload new episodes via admin.html - app updates automatically!</p>
</div>

<div class="cats" id="cats">
<button class="active" onclick="filterCat('all',this)">All</button>
<button onclick="filterCat('Revenge',this)">Revenge</button>
<button onclick="filterCat('Romance',this)">Romance</button>
<button onclick="filterCat('CEO',this)">CEO</button>
<button onclick="filterCat('Werewolf',this)">Werewolf</button>
</div>

<div class="grid" id="grid"></div>

<div class="player" id="player">
<div class="player-top">
<span id="pTitle">Playing</span>
<button onclick="closePlayer()" style="background:#333;border:0;color:#fff;padding:6px 12px;border-radius:6px">✕ Close</button>
</div>
<div class="video-wrap">
<video id="video" controls playsinline></video>
</div>
<div class="ep-list" id="epList"></div>
</div>

<script>
// SAMPLE DATA - You can replace via admin.html later
let dramas = JSON.parse(localStorage.getItem('takueflix_dramas')) || `[
{"id":1,"title":"The CEO's Regret After Divorce","cat":"CEO","cover":"https://picsum.photos/300/400?random=1","eps":["https://www.w3schools.com/html/mov_bbb.mp4","https://www.w3schools.com/html/movie.mp4"]},
{"id":2,"title":"Revenge of The Ex-Wife","cat":"Revenge","cover":"https://picsum.photos/300/400?random=2","eps":["https://www.w3schools.com/html/mov_bbb.mp4"]},
{"id":3,"title":"My Werewolf Boyfriend","cat":"Werewolf","cover":"https://picsum.photos/300/400?random=3","eps":["https://www.w3schools.com/html/mov_bbb.mp4"]}
]`;

let currentFilter = 'all';
function render(list){
  const g=document.getElementById('grid');
  g.innerHTML='';
  list.forEach(d=>{
    g.innerHTML+=`<div class="card" onclick="playDrama(${d.id})">
    <img src="${d.cover}"><div class="card-info"><h4>${d.title}</h4><p>${d.cat} • ${d.eps.length} Eps</p></div></div>`;
  });
}
function playDrama(id){
  const d=dramas.find(x=>x.id===id);
  document.getElementById('player').classList.add('active');
  document.getElementById('pTitle').innerText=d.title;
  const epBox=document.getElementById('epList');
  epBox.innerHTML='';
  d.eps.forEach((url,i)=>{
    epBox.innerHTML+=`<button id="ep${i}" onclick="playEp('${url}',${i})">Ep ${i+1}</button>`;
  });
  playEp(d.eps[0],0);
}
function playEp(url,i){
  const v=document.getElementById('video');
  v.src=url; v.play();
  document.querySelectorAll('.ep-list button').forEach(b=>b.classList.remove('playing'));
  const b=document.getElementById('ep'+i); if(b) b.classList.add('playing');
}
function closePlayer(){document.getElementById('player').classList.remove('active');document.getElementById('video').pause();}
function filterCat(cat,btn){
  currentFilter=cat;
  document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(cat==='all') render(dramas); else render(dramas.filter(d=>d.cat===cat));
}
function doSearch(){
  const q=document.getElementById('search').value.toLowerCase();
  render(dramas.filter(d=>d.title.toLowerCase().includes(q)));
}
render(dramas);
</script>
</body>
</html>
