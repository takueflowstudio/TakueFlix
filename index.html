<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#0b63f6">

<title>TakueFlix — Your World of Stories</title>

<style>
/* =========================================================
   TAKUEFLIX
   Clean mobile-first CSS
========================================================= */

:root {
    --blue: #0b63f6;
    --blue-dark: #064bbd;
    --blue-light: #eaf3ff;

    --bg: #f6f8fc;
    --card: #ffffff;
    --text: #101828;
    --muted: #667085;
    --border: #e4e7ec;

    --danger: #e53935;
    --success: #12b76a;

    --shadow: 0 8px 30px rgba(16,24,40,.08);
    --radius: 16px;

    --nav-height: 68px;
}

body.dark {
    --bg: #0b1220;
    --card: #121b2c;
    --text: #f5f7fa;
    --muted: #a7b0c0;
    --border: #253249;
    --blue-light: #102d59;

    --shadow: 0 8px 30px rgba(0,0,0,.35);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: var(--bg);
    color: var(--text);

    min-height: 100vh;

    padding-bottom: calc(
        var(--nav-height) +
        env(safe-area-inset-bottom)
    );
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    border: none;
    cursor: pointer;
}

img {
    max-width: 100%;
    display: block;
}

.hidden {
    display: none !important;
}

/* =========================================================
   HEADER
========================================================= */

.topbar {
    position: sticky;
    top: 0;
    z-index: 100;

    height: 62px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 16px;

    background: var(--card);
    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: -.7px;
}

.logo span {
    color: var(--blue);
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: var(--bg);
    color: var(--text);

    font-size: 19px;
}

.icon-btn:active {
    transform: scale(.94);
}

/* =========================================================
   PAGE
========================================================= */

.page {
    width: 100%;
    max-width: 1200px;
    margin: auto;
}

.section {
    padding: 22px 16px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 13px;
}

.section-title h2 {
    font-size: 20px;
}

.section-title button {
    background: transparent;
    color: var(--blue);
    font-weight: 700;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    margin: 14px 12px 0;

    min-height: 330px;

    border-radius: 22px;

    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.05),
            rgba(0,0,0,.85)
        ),
        linear-gradient(
            135deg,
            #0b63f6,
            #09285c
        );
}

.hero-content {
    position: absolute;

    left: 20px;
    right: 20px;
    bottom: 20px;

    color: white;
}

.hero-badge {
    display: inline-block;

    padding: 6px 10px;

    border-radius: 20px;

    background: rgba(255,255,255,.16);

    backdrop-filter: blur(8px);

    font-size: 12px;
    font-weight: 800;

    margin-bottom: 9px;
}

.hero h1 {
    font-size: 30px;
    line-height: 1.05;

    margin-bottom: 9px;
}

.hero p {
    font-size: 14px;
    line-height: 1.45;

    opacity: .9;

    max-width: 550px;

    margin-bottom: 14px;
}

.hero-buttons {
    display: flex;
    gap: 9px;
}

.btn {
    min-height: 44px;

    padding: 0 16px;

    border-radius: 12px;

    font-weight: 800;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 7px;
}

.btn-primary {
    background: var(--blue);
    color: white;
}

.btn-white {
    background: white;
    color: #111827;
}

.btn-outline {
    background: transparent;
    color: var(--text);

    border: 1px solid var(--border);
}

.btn-danger {
    background: var(--danger);
    color: white;
}

/* =========================================================
   CAROUSELS
========================================================= */

.horizontal-scroll {
    display: flex;
    gap: 12px;

    overflow-x: auto;

    padding-bottom: 7px;

    scrollbar-width: none;
}

.horizontal-scroll::-webkit-scrollbar {
    display: none;
}

/* =========================================================
   SERIES CARDS
========================================================= */

.series-card {
    flex: 0 0 145px;

    background: var(--card);

    border-radius: 14px;

    overflow: hidden;

    box-shadow: var(--shadow);

    cursor: pointer;

    border: 1px solid var(--border);
}

.poster {
    aspect-ratio: 2 / 3;

    position: relative;

    display: flex;
    align-items: flex-end;

    padding: 10px;

    overflow: hidden;
}

.poster::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            transparent 35%,
            rgba(0,0,0,.85)
        );
}

.poster-content {
    position: relative;
    z-index: 2;

    color: white;
}

.poster-title {
    font-weight: 900;
    font-size: 15px;

    line-height: 1.1;
}

.poster-genre {
    font-size: 11px;

    margin-top: 4px;

    opacity: .85;
}

.series-info {
    padding: 9px;
}

.series-name {
    font-size: 14px;
    font-weight: 800;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.series-meta {
    color: var(--muted);

    font-size: 11px;

    margin-top: 4px;
}

.card-actions {
    display: flex;
    justify-content: space-between;

    margin-top: 8px;
}

.small-btn {
    width: 32px;
    height: 32px;

    border-radius: 50%;

    background: var(--bg);
    color: var(--text);
}

.small-btn.active {
    color: var(--blue);
}

/* =========================================================
   GRID
========================================================= */

.series-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 12px;
}

.series-grid .series-card {
    width: 100%;
}

/* =========================================================
   CATEGORIES
========================================================= */

.categories {
    display: flex;
    gap: 8px;

    overflow-x: auto;

    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    flex: 0 0 auto;

    padding: 9px 14px;

    border-radius: 30px;

    background: var(--card);

    border: 1px solid var(--border);

    color: var(--text);

    font-size: 13px;
    font-weight: 700;
}

.category.active {
    background: var(--blue);
    color: white;

    border-color: var(--blue);
}

/* =========================================================
   SEARCH
========================================================= */

.search-box {
    padding: 12px 16px;

    position: sticky;
    top: 62px;

    z-index: 80;

    background: var(--bg);
}

.search-input {
    width: 100%;

    height: 48px;

    border-radius: 14px;

    border: 1px solid var(--border);

    background: var(--card);

    color: var(--text);

    padding: 0 16px;

    outline: none;
}

.search-input:focus {
    border-color: var(--blue);
}

/* =========================================================
   CONTINUE WATCHING
========================================================= */

.continue-card {
    flex: 0 0 220px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 14px;

    overflow: hidden;
}

.continue-thumb {
    height: 120px;

    background:
        linear-gradient(
            135deg,
            #0b63f6,
            #14213d
        );

    position: relative;
}

.continue-play {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%,-50%);

    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: rgba(255,255,255,.95);

    color: var(--blue);

    display: flex;
    align-items: center;
    justify-content: center;
}

.progress {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 4px;

    background: rgba(255,255,255,.25);
}

.progress span {
    display: block;

    height: 100%;

    background: var(--blue);

    width: 40%;
}

.continue-info {
    padding: 10px;
}

.continue-info strong {
    display: block;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.continue-info small {
    color: var(--muted);
}

/* =========================================================
   COMING SOON
========================================================= */

.coming-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;

    padding: 15px;

    display: flex;
    gap: 14px;
}

.coming-poster {
    width: 90px;
    height: 120px;

    border-radius: 10px;

    flex-shrink: 0;

    background:
        linear-gradient(
            135deg,
            #0b63f6,
            #071c3a
        );
}

.coming-info {
    flex: 1;
}

.coming-info h3 {
    margin-bottom: 6px;
}

.coming-info p {
    color: var(--muted);

    font-size: 13px;

    line-height: 1.4;

    margin-bottom: 10px;
}

.countdown {
    font-weight: 800;

    color: var(--blue);

    margin-bottom: 10px;
}

/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: var(--nav-height);

    padding-bottom: env(safe-area-inset-bottom);

    background: var(--card);

    border-top: 1px solid var(--border);

    z-index: 200;

    display: grid;

    grid-template-columns:
        repeat(5,1fr);
}

.nav-item {
    background: transparent;

    color: var(--muted);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 3px;

    font-size: 11px;

    position: relative;
}

.nav-icon {
    font-size: 20px;
}

.nav-item.active {
    color: var(--blue);
    font-weight: 800;
}

/* =========================================================
   MODALS
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 500;

    background: rgba(0,0,0,.65);

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding: 0;
}

.modal-card {
    width: 100%;

    max-width: 720px;

    max-height: 92vh;

    overflow-y: auto;

    background: var(--card);

    color: var(--text);

    border-radius: 22px 22px 0 0;

    padding: 18px;

    animation: slideUp .2s ease;
}

@keyframes slideUp {
    from {
        transform: translateY(30px);
        opacity: 0;
    }

    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.modal-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 14px;
}

.close {
    width: 40px;
    height: 40px;

    border-radius: 50%;

    background: var(--bg);

    color: var(--text);

    font-size: 20px;
}

/* =========================================================
   DETAIL
========================================================= */

.detail-hero {
    height: 210px;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #0b63f6,
            #071a35
        );

    margin-bottom: 15px;

    display: flex;
    align-items: flex-end;

    padding: 16px;

    color: white;
}

.detail-title {
    font-size: 26px;
    font-weight: 900;
}

.detail-meta {
    color: var(--muted);

    font-size: 13px;

    margin: 8px 0 12px;
}

.detail-description {
    line-height: 1.55;

    color: var(--muted);

    font-size: 14px;

    margin-bottom: 14px;
}

.detail-actions {
    display: flex;
    gap: 8px;

    margin-bottom: 18px;

    flex-wrap: wrap;
}

/* =========================================================
   EPISODES
========================================================= */

.episode {
    display: flex;

    gap: 12px;

    padding: 12px 0;

    border-bottom: 1px solid var(--border);

    cursor: pointer;
}

.episode-number {
    width: 42px;
    height: 42px;

    border-radius: 10px;

    background: var(--blue-light);

    color: var(--blue);

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: 900;

    flex-shrink: 0;
}

.episode-info {
    flex: 1;
}

.episode-info strong {
    display: block;

    margin-bottom: 3px;
}

.episode-info small {
    color: var(--muted);

    line-height: 1.4;
}

.lock {
    align-self: center;

    color: var(--muted);

    font-size: 18px;
}

/* =========================================================
   PLAYER
========================================================= */

.player-modal {
    align-items: center;

    background: #000;
}

.player-card {
    width: 100%;
    max-width: 1000px;

    background: #000;

    color: white;

    max-height: 100vh;

    overflow-y: auto;
}

.video-wrap {
    position: relative;

    width: 100%;

    background: #000;
}

.video-wrap video {
    width: 100%;

    display: block;

    aspect-ratio: 16/9;

    background: #000;
}

.player-top {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 12px;
}

.player-controls {
    display: flex;

    gap: 7px;

    padding: 10px;
}

.player-control {
    background: #202020;

    color: white;

    min-height: 40px;

    padding: 0 11px;

    border-radius: 9px;
}

.next-countdown {
    background: rgba(11,99,246,.95);

    color: white;

    padding: 14px;

    text-align: center;
}

.player-info {
    padding: 15px;
}

.player-info p {
    color: #aaa;

    font-size: 13px;

    line-height: 1.5;
}

/* =========================================================
   PREMIUM
========================================================= */

.plans {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

.plan {
    border: 1px solid var(--border);

    background: var(--bg);

    padding: 14px;

    border-radius: 14px;
}

.plan.featured {
    border: 2px solid var(--blue);
}

.plan h3 {
    font-size: 15px;

    margin-bottom: 6px;
}

.plan-price {
    font-size: 22px;

    font-weight: 900;

    color: var(--blue);

    margin-bottom: 7px;
}

.plan small {
    color: var(--muted);
}

/* =========================================================
   COMMENTS
========================================================= */

.comment {
    padding: 12px 0;

    border-bottom: 1px solid var(--border);
}

.comment strong {
    display: block;

    margin-bottom: 4px;
}

.comment p {
    color: var(--muted);

    font-size: 14px;

    line-height: 1.45;
}

.comment-actions {
    display: flex;

    gap: 10px;

    margin-top: 7px;
}

.comment-actions button {
    background: transparent;

    color: var(--muted);

    font-size: 12px;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 18px;

    text-align: center;
}

.avatar {
    width: 72px;
    height: 72px;

    border-radius: 50%;

    background: var(--blue);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 10px;

    font-size: 27px;
    font-weight: 900;
}

.profile-stats {
    display: grid;

    grid-template-columns: repeat(3,1fr);

    gap: 8px;

    margin-top: 16px;
}

.profile-stat {
    background: var(--bg);

    padding: 10px;

    border-radius: 12px;
}

.profile-stat strong {
    display: block;

    font-size: 18px;
}

.profile-stat small {
    color: var(--muted);
}

/* =========================================================
   NOTIFICATIONS
========================================================= */

.notification {
    padding: 13px 0;

    border-bottom: 1px solid var(--border);

    display: flex;

    gap: 10px;
}

.notification.unread {
    background: var(--blue-light);

    margin: 0 -10px;

    padding-left: 10px;
    padding-right: 10px;
}

.notification-icon {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    background: var(--blue);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;
}

.notification-content {
    flex: 1;
}

.notification-content strong {
    display: block;

    margin-bottom: 3px;
}

.notification-content small {
    color: var(--muted);
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    left: 50%;

    bottom: calc(
        var(--nav-height) +
        env(safe-area-inset-bottom) +
        15px
    );

    transform: translateX(-50%) translateY(20px);

    background: #111827;

    color: white;

    padding: 12px 16px;

    border-radius: 12px;

    font-size: 13px;

    z-index: 1000;

    opacity: 0;

    pointer-events: none;

    transition: .25s;
}

.toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   EMPTY
========================================================= */

.empty {
    padding: 40px 15px;

    text-align: center;

    color: var(--muted);
}

.empty-icon {
    font-size: 42px;

    margin-bottom: 10px;
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 700px) {

    body {
        padding-bottom: 0;
    }

    .bottom-nav {
        position: sticky;

        top: 0;

        width: max-content;

        margin: 10px auto;

        height: 50px;

        border: 1px solid var(--border);

        border-radius: 15px;

        padding: 0 10px;

        display: flex;

        gap: 5px;
    }

    .nav-item {
        min-width: 95px;

        padding: 0 12px;
    }

    .hero {
        margin: 20px 16px 0;

        min-height: 430px;
    }

    .series-grid {
        grid-template-columns:
            repeat(4,minmax(0,1fr));
    }

    .modal {
        align-items: center;

        padding: 20px;
    }

    .modal-card {
        border-radius: 20px;
    }
}
</style>
</head>

<body>

<!-- ======================================================
     HEADER
====================================================== -->

<header class="topbar">

    <div class="logo">
        TAKUE<span>FLIX</span>
    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            id="notificationBtn"
            aria-label="Notifications">
            🔔
        </button>

        <button
            class="icon-btn"
            id="themeBtn"
            aria-label="Change theme">
            🌙
        </button>

    </div>

</header>


<main class="page">

<!-- ======================================================
     HOME
====================================================== -->

<section id="homePage" class="app-page">

    <div class="hero">

        <div class="hero-content">

            <span class="hero-badge">
                TAKUEFLIX ORIGINAL
            </span>

            <h1>
                The CEO's Secret
